name: dotnet
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build src/IdleNumbers/IdleNumbers.csproj -c Release
      - name: Tests (self contained runner)
        run: dotnet run --project tests/IdleNumbers.Tests/IdleNumbers.Tests.csproj -c Release
